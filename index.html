<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI心理咨询数字人</title>
    <style>
        :root {
            --bg: #f7f5f2;
            --card-bg: #ffffff;
            --primary: #7c6fa0;
            --primary-light: #a99ec5;
            --text: #3d3649;
            --text-light: #6b6277;
            --user-bubble: #e8e2f3;
            --ai-bubble: #fdfbf9;
            --border: #e5e0eb;
            --shadow: 0 4px 20px rgba(60,40,80,0.08);
            --radius: 18px;
            --radius-sm: 10px;
            --transition: 0.3s ease;
            --font: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:var(--font);
            background:linear-gradient(160deg,#f5f0f0 0%,#f0eef6 30%,#f6f3f0 60%,#f2eff5 100%);
            background-attachment:fixed;min-height:100vh;display:flex;justify-content:center;align-items:center;
            padding:12px;-webkit-tap-highlight-color:transparent;user-select:none;
        }
        .app-container{
            width:100%;max-width:520px;background:var(--card-bg);border-radius:24px;box-shadow:var(--shadow);
            display:flex;flex-direction:column;overflow:hidden;height:92vh;max-height:880px;min-height:620px;
            position:relative;
        }
        .top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;background:var(--card-bg);z-index:2;flex-wrap:wrap;}
        .brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:0.95rem;color:var(--primary);}
        .brand .dot{width:8px;height:8px;border-radius:50%;background:#7ecb9a;animation:pulse-dot 2s infinite;}
        @keyframes pulse-dot{0%,100%{box-shadow:0 0 6px rgba(126,203,154,0.4);}50%{box-shadow:0 0 16px rgba(126,203,154,0.75);}}
        .func-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
        .btn-func{background:#f5f2f9;color:var(--primary);font-size:0.72rem;font-weight:600;border:1.5px solid transparent;padding:5px 10px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:all var(--transition);white-space:nowrap;}
        .btn-func:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
        .btn-icon{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--text-light);transition:all var(--transition);flex-shrink:0;}
        .btn-icon:hover{background:#f9f7fb;border-color:var(--primary-light);}
        .btn-icon.muted{background:#fef5f5;border-color:#e8c0c0;color:#c97a7a;}
        .btn-icon .icon-speak-off{display:none;}
        .btn-icon.muted .icon-speak-on{display:none;}
        .btn-icon.muted .icon-speak-off{display:inline;}
        .digital-human-area{display:flex;justify-content:center;align-items:center;padding:4px 20px 8px;background:var(--card-bg);position:relative;}
        .digital-human-img{width:200px;height:220px;object-fit:contain;transition:opacity 0.3s;}
        .aura-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;border:2px solid rgba(180,160,200,0.2);pointer-events:none;animation:aura-pulse 3s ease-in-out infinite;}
        @keyframes aura-pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5;}50%{transform:translate(-50%,-50%) scale(1.15);opacity:0.15;}}
        .chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0 16px;background:var(--card-bg);}
        .messages-container{flex:1;overflow-y:auto;padding:8px 4px 14px;display:flex;flex-direction:column;gap:10px;}
        .message{display:flex;animation:msg-in 0.35s ease-out;}
        @keyframes msg-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
        .message.user{justify-content:flex-end;}
        .message.ai{justify-content:flex-start;}
        .bubble{max-width:82%;padding:11px 16px;border-radius:var(--radius-sm);font-size:0.93rem;line-height:1.55;word-break:break-word;}
        .message.user .bubble{background:var(--user-bubble);color:var(--text);border-bottom-right-radius:4px;}
        .message.ai .bubble{background:var(--ai-bubble);color:var(--text);border-bottom-left-radius:4px;border:1.5px solid #f0ecf5;}
        .message .time{font-size:0.68rem;color:#b0a8b8;margin-top:4px;padding:0 4px;}
        .input-area{padding:6px 0 10px;display:flex;flex-direction:column;gap:8px;}
        .input-row{display:flex;gap:8px;align-items:center;}
        .input-row input{flex:1;padding:13px 16px;border-radius:26px;border:1.5px solid var(--border);font-size:0.93rem;font-family:var(--font);outline:none;background:#faf9fb;color:var(--text);}
        .input-row input:focus{border-color:var(--primary-light);background:#fff;}
        .btn-send{width:46px;height:46px;border-radius:50%;border:none;background:var(--primary);color:#fff;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(124,111,160,0.3);transition:all var(--transition);}
        .btn-send:hover{background:#8b7db5;}
        .btn-send:disabled{background:#c8c0d8;cursor:not-allowed;}
        .suggested-questions{display:flex;flex-wrap:wrap;gap:7px;}
        .suggested-tag{font-size:0.78rem;padding:7px 14px;border-radius:18px;border:1.3px solid var(--border);background:#fdfcfd;cursor:pointer;color:var(--text-light);white-space:nowrap;transition:all var(--transition);}
        .suggested-tag:hover{background:#f5f2f9;border-color:var(--primary-light);color:var(--primary);}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(30,20,40,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.3s ease;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .modal-content{background:#fff;border-radius:20px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.2);}
        .modal-content h2{color:var(--primary);margin-bottom:16px;font-size:1.3rem;}
        .question-block{margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:15px;}
        .question-text{font-weight:600;margin-bottom:8px;color:var(--text);}
        .options{display:flex;flex-direction:column;gap:6px;}
        .option-label{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:all 0.2s;font-size:0.9rem;}
        .option-label:hover{background:#f9f7fb;border-color:var(--primary-light);}
        .option-label input[type="radio"]{accent-color:var(--primary);}
        .option-label.selected{background:#f0ecf7;border-color:var(--primary);}
        .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;}
        .btn-primary,.btn-secondary{padding:10px 20px;border-radius:20px;border:none;cursor:pointer;font-size:0.9rem;font-weight:600;}
        .btn-primary{background:var(--primary);color:#fff;}
        .btn-primary:hover{background:#8b7db5;}
        .btn-secondary{background:#f0ecf5;color:var(--text);}
        .btn-secondary:hover{background:#e5ddef;}
        .result-box{background:#f9f7fb;border-radius:14px;padding:20px;margin-top:20px;text-align:center;}
        .score{font-size:2rem;font-weight:700;color:var(--primary);margin:8px 0;}
        .grade{font-size:1.1rem;font-weight:600;margin-bottom:8px;}
        .test-set-list{list-style:none;padding:0;}
        .test-set-item{padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all var(--transition);}
        .test-set-item:hover{background:#f9f7fb;border-color:var(--primary-light);}
        .test-set-item .name{font-weight:600;color:var(--text);}
        .test-set-item .count{font-size:0.8rem;color:#888;margin-top:4px;}
        @media (max-width:560px){
            .digital-human-img{width:150px;height:170px;}
            .top-bar{padding:8px 12px 4px;}
            .btn-func{font-size:0.68rem;padding:4px 8px;}
            .brand{font-size:0.85rem;}
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <div class="brand"><span class="dot"></span> 心灵倾听者</div>
            <div class="func-btns">
                <button class="btn-func" id="assessmentBtn">📋 测评</button>
                <button class="btn-func" id="activityBtn">🎯 活动</button>
                <button class="btn-func" id="writingBtn">✍️ 书写练习</button>
                <button class="btn-func" id="improveBtn">🚀 我要提升</button>
            </div>
            <button class="btn-icon" id="muteBtn">
                <span class="icon-speak-on">🔊</span><span class="icon-speak-off">🔇</span>
            </button>
        </div>
        <div class="digital-human-area">
            <div class="aura-ring"></div>
            <img id="digitalHumanImg" class="digital-human-img" src="idle.gif" alt="数字人">
        </div>
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="message ai"><div><div class="bubble">你好呀~ 我是你的专属心理咨询助手 💜<br>有什么想和我聊聊的吗？</div><div class="time" style="text-align:left;">刚刚</div></div></div>
            </div>
            <div class="input-area">
                <div class="suggested-questions" id="suggestedQuestions"></div>
                <div class="input-row">
                    <input type="text" id="userInput" placeholder="在这里输入你想说的话..." autocomplete="off">
                    <button class="btn-send" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>
    <div id="assessmentModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // ==================== 存储键 ====================
        const STORAGE_KEY = 'psy_qa_data';
        const ASSESS_STORAGE_KEY = 'psy_assessments';
        const CONVERSATIONS_KEY = 'psy_conversations';
        const ALERTS_KEY = 'psy_alerts';
        const DANGER_KEYWORDS_KEY = 'psy_danger_keywords';
        const TEST_SETS_KEY = 'psy_test_sets';

        // ==================== 问答数据 ====================
        const defaultQAData = [
            {id:1, question:'你好', answer:'你好呀~ 我是你的心理咨询助手。今天感觉怎么样？💜', keywords:['你好','嗨','hello']},
            {id:2, question:'我最近压力很大', answer:'压力是常见的体验。能具体和我说说吗？🌿', keywords:['压力','焦虑','紧张']},
            {id:3, question:'我睡不着怎么办', answer:'试试深呼吸练习……你愿意聊聊心事吗？🌙', keywords:['失眠','睡不着','睡眠']},
            {id:4, question:'我情绪很低落', answer:'给你一个温暖的拥抱。能告诉我持续多久了吗？🫂', keywords:['难过','低落','抑郁','不开心']},
            {id:5, question:'怎么调节自己的情绪', answer:'可以尝试给情绪命名、深呼吸、转移注意力等。', keywords:['调节情绪','控制情绪','发脾气']},
            {id:6, question:'我觉得自己不够好', answer:'每个人都有自己的闪光点，要不要列出三件满意的小事？✨', keywords:['不自信','自卑','不够好']},
            {id:7, question:'人际关系让我很累', answer:'学会温和表达自己的需求。想聊聊具体关系吗？', keywords:['人际关系','社交','朋友','同事']},
            {id:8, question:'谢谢你的帮助', answer:'不用客气~ 我都在这里。💜🌟', keywords:['谢谢','感谢']}
        ];
        function loadQAData() {
            try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { const data = JSON.parse(raw); if (Array.isArray(data) && data.length) return data; } } catch(e) {}
            saveQAData(defaultQAData); return [...defaultQAData];
        }
        function saveQAData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        let qaData = loadQAData();
        function refreshQAData() { qaData = loadQAData(); }

        // ==================== 动态危险关键词 ====================
        const DEFAULT_DANGER_KEYWORDS = ['自杀','自残','去死','不想活','结束生命','跳楼','割腕','上吊','安眠药','杀死','杀人','暴力','虐待','伤害自己','想死','活不下去','没意义','极度绝望','无药可救','毁灭','报复社会','恐怖','炸弹'];
        function getDangerKeywords() { try { const raw = localStorage.getItem(DANGER_KEYWORDS_KEY); if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr; } } catch(e) {} return [...DEFAULT_DANGER_KEYWORDS]; }
        function isDangerousMessage(text) { const keywords = getDangerKeywords(); const lower = text.toLowerCase(); return keywords.some(kw => lower.includes(kw.toLowerCase())); }

        // ==================== 智能动态回复（豆包AI失败时的兜底） ====================
        function generateDynamicReply(userInput) {
            const input = userInput.trim(); const lower = input.toLowerCase();
            const emotionMap = [
                { keywords: ['难过','伤心','想哭','哭'], reply: '我能感受到你的难过，这种情绪一定让你很辛苦。想和我具体说说发生了什么吗？' },
                { keywords: ['孤独','寂寞','一个人'], reply: '孤独感确实很不好受。你并不孤单，愿意多和我聊聊吗？' },
                { keywords: ['焦虑','紧张','担心','害怕'], reply: '焦虑和紧张常常源于不确定性，我们可以一起试着梳理一下。' },
                { keywords: ['生气','愤怒','讨厌','烦'], reply: '生气是正常的情绪反应，你愿意告诉我是什么事情让你这么生气吗？' },
                { keywords: ['累','疲惫','没力气'], reply: '长期疲惫也会影响情绪，你最近是身体累还是心累呢？' },
                { keywords: ['无聊','没意思','空虚'], reply: '感到生活乏味也是值得关注的信号，我们可以一起探索一下。' },
                { keywords: ['开心','快乐','高兴'], reply: '听到你感到开心，我也为你高兴！能分享一下发生了什么好事吗？' }
            ];
            const topicMap = [
                { keywords: ['工作','上班','同事','老板'], reply: '工作上的事情常常影响整体状态，愿意具体说说吗？' },
                { keywords: ['家庭','父母','孩子','老公','老婆'], reply: '家庭关系有时也会带来压力，能告诉我是什么问题困扰你吗？' },
                { keywords: ['感情','恋爱','分手'], reply: '感情问题触及我们最柔软的部分，愿意多分享一些吗？' },
                { keywords: ['朋友','闺蜜','兄弟'], reply: '朋友之间有时也会有摩擦，具体是什么事呢？' },
                { keywords: ['学习','考试','成绩'], reply: '学习压力不小，适当休息和调整方法会很有帮助。' },
                { keywords: ['健康','生病','身体','睡眠'], reply: '身体和心理相互影响，可以详细说说你的状况吗？' }
            ];
            for (const item of emotionMap) if (item.keywords.some(kw => lower.includes(kw))) return item.reply;
            for (const item of topicMap) if (item.keywords.some(kw => lower.includes(kw))) return item.reply;
            const words = input.replace(/[，。！？、,.!?]/g, ' ').split(/\s+/).filter(w => w.length >= 1);
            const meaningfulWords = words.filter(w => /^[\u4e00-\u9fa5]{2,}$/.test(w));
            if (meaningfulWords.length > 0) { const keyTopic = meaningfulWords.slice(0,2).join('、'); return `你提到了“${keyTopic}”，我很想了解更多。可以再详细说说吗？`; }
            return '谢谢你的分享，我很想更深入地了解你的感受。可以再多和我说一些吗？';
        }

        // ==================== 答案查找（预设优先 → 豆包AI → 智能回复） ====================
        async function findAnswer(input) {
            refreshQAData();
            const q = input.trim(); if (!q) return null;
            const lower = q.toLowerCase();
            // 1. 精确匹配预设问题
            for (const item of qaData) if (item.question.trim() === q) return item.answer;
            // 2. 关键词匹配
            let best = null, bestScore = 0;
            for (const item of qaData) {
                if (item.keywords && Array.isArray(item.keywords))
                    for (const kw of item.keywords) if (lower.includes(kw.toLowerCase()) && kw.length > bestScore) { bestScore = kw.length; best = item; }
            }
            if (best) return best.answer;
            // 3. 部分包含匹配
            for (const item of qaData) if (item.question.includes(q) || q.includes(item.question)) return item.answer;
            // 4. 调用豆包AI，失败则智能回复
            return await fetchChatAI(q);
        }

        // 调用豆包AI
        async function fetchChatAI(query) {
            try {
                const res = await fetch(`/.netlify/functions/chat?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error('AI接口异常');
                const data = await res.json();
                return data.answer || generateDynamicReply(query);
            } catch (e) {
                console.warn('豆包AI调用失败，使用智能回复', e);
                return generateDynamicReply(query);
            }
        }

        function getRandomQuestions(count=3) { refreshQAData(); if (!qaData.length) return ['你好','我最近压力很大']; const shuffled = [...qaData].sort(()=>Math.random()-0.5); return shuffled.slice(0, Math.min(count, shuffled.length)).map(q=>q.question); }

        // ==================== 对话记录存储 ====================
        function saveConversation(userMsg, aiReply, isDanger) {
            const record = { timestamp: new Date().toISOString(), userMessage: userMsg, aiReply: aiReply, isDanger };
            const raw = localStorage.getItem(CONVERSATIONS_KEY); const conversations = raw ? JSON.parse(raw) : [];
            conversations.push(record); if (conversations.length > 500) conversations.splice(0, conversations.length - 500);
            localStorage.setItem(CONVERSATIONS_KEY, JSON.stringify(conversations));
        }

        // ==================== 异常警报 ====================
        function requestNotificationPermission() { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }
        requestNotificationPermission();
        function sendDangerAlert(userMessage) {
            if ('Notification' in window && Notification.permission === 'granted') new Notification('⚠️ 异常对话警告', { body: `用户说：“${userMessage}”` });
            const alertRecord = { timestamp: new Date().toISOString(), userMessage, alert:'危险言论' };
            const raw = localStorage.getItem(ALERTS_KEY); const alerts = raw ? JSON.parse(raw) : [];
            alerts.push(alertRecord); if (alerts.length > 200) alerts.shift();
            localStorage.setItem(ALERTS_KEY, JSON.stringify(alerts));
        }

        // ==================== GIF 切换 ====================
        const digitalHumanImg = document.getElementById('digitalHumanImg');
        const IDLE_GIF = 'idle.gif', SPEAKING_GIF = 'speaking.gif';
        function setIdle() { digitalHumanImg.src = IDLE_GIF; }
        function setSpeaking() { digitalHumanImg.src = SPEAKING_GIF; }

        // ==================== 语音播报 ====================
        let isMuted = false, currentUtterance = null, xiaoxiaoVoice = null;
        function loadVoices() { const voices = speechSynthesis.getVoices(); xiaoxiaoVoice = voices.find(v => v.name.toLowerCase().includes('xiaoxiao')) || null; }
        loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
        function speakText(text) {
            stopSpeaking(); if (isMuted || !text) return;
            const u = new SpeechSynthesisUtterance(text); if (xiaoxiaoVoice) u.voice = xiaoxiaoVoice;
            u.rate = 0.95; u.pitch = 1.05; u.volume = 0.9;
            u.onstart = () => setSpeaking();
            u.onend = () => { setIdle(); currentUtterance = null; };
            u.onerror = () => { setIdle(); currentUtterance = null; };
            currentUtterance = u; speechSynthesis.speak(u);
        }
        function stopSpeaking() { if (currentUtterance || speechSynthesis.speaking) { speechSynthesis.cancel(); currentUtterance = null; } setIdle(); }
        document.getElementById('muteBtn').addEventListener('click', () => { isMuted = !isMuted; document.getElementById('muteBtn').classList.toggle('muted', isMuted); if (isMuted) stopSpeaking(); });

        // ==================== 聊天UI ====================
        const messagesContainer = document.getElementById('messagesContainer'), userInput = document.getElementById('userInput'), sendBtn = document.getElementById('sendBtn'), suggestedContainer = document.getElementById('suggestedQuestions');
        function scrollToBottom() { messagesContainer.scrollTop = messagesContainer.scrollHeight; }
        function addMessage(text, type) {
            const div = document.createElement('div'); div.className = `message ${type}`;
            const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            div.innerHTML = `<div><div class="bubble">${text}</div><div class="time" style="text-align:${type==='user'?'right':'left'};">${time}</div></div>`;
            messagesContainer.appendChild(div); scrollToBottom();
        }
        function refreshSuggested() {
            const qs = getRandomQuestions(3); suggestedContainer.innerHTML = '';
            qs.forEach(q => { const tag = document.createElement('span'); tag.className = 'suggested-tag'; tag.textContent = q; tag.onclick = () => handleMessage(q); suggestedContainer.appendChild(tag); });
        }
        async function handleMessage(text) {
            if (!text.trim()) return; const userMsg = text.trim();
            addMessage(userMsg, 'user'); userInput.value = ''; sendBtn.disabled = true; userInput.disabled = true; stopSpeaking();
            const isDanger = isDangerousMessage(userMsg); if (isDanger) sendDangerAlert(userMsg);
            await new Promise(r => setTimeout(r, 400 + Math.random() * 500));
            const aiReply = await findAnswer(userMsg);
            addMessage(aiReply, 'ai');
            saveConversation(userMsg, aiReply, isDanger);
            if (!isMuted) speakText(aiReply); else { setSpeaking(); setTimeout(() => setIdle(), Math.min(8000, aiReply.length * 80)); }
            sendBtn.disabled = false; userInput.disabled = false; userInput.focus(); refreshSuggested();
        }
        sendBtn.addEventListener('click', () => handleMessage(userInput.value));
        userInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleMessage(userInput.value); } });

        // ==================== 多套测评功能 ====================
        function getTestSets() { const raw = localStorage.getItem(TEST_SETS_KEY); return raw ? JSON.parse(raw) : []; }
        function saveTestSets(sets) { localStorage.setItem(TEST_SETS_KEY, JSON.stringify(sets)); }
        function initDefaultTestSets() {
            if (getTestSets().length === 0) {
                const defaultSet = {
                    id: 1, name: '心理健康自评量表(PHQ-9)',
                    questions: [
                        { id:1, text:'做事时提不起劲或没有兴趣', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:2, text:'感到心情低落、沮丧或绝望', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:3, text:'入睡困难、睡不安稳或睡眠过多', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:4, text:'感觉疲倦或没有活力', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:5, text:'食欲不振或吃太多', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:6, text:'觉得自己很糟，或让自己或家人失望', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:7, text:'对事物专注有困难', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:8, text:'动作或说话速度缓慢或烦躁', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:9, text:'有不如死掉或用某种方式伤害自己的念头', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] },
                        { id:10, text:'是否经常感到紧张、焦虑或不安', options:[{value:0,label:'完全不会'},{value:1,label:'好几天'},{value:2,label:'一半以上的天数'},{value:3,label:'几乎每天'}] }
                    ]
                };
                saveTestSets([defaultSet]);
            }
        }
        initDefaultTestSets();

        let currentTestSet = null, userAnswers = {};
        function openAssessment() {
            const sets = getTestSets();
            if (sets.length === 0) { alert('暂无可用测评试题'); return; }
            if (sets.length === 1) startAssessment(sets[0]);
            else showTestSetSelector(sets);
        }
        function showTestSetSelector(sets) {
            const modal = document.getElementById('assessmentModal'), content = document.getElementById('modalContent');
            content.innerHTML = `<h2>📋 选择测评问卷</h2><ul class="test-set-list">${sets.map((s,i)=>`<li class="test-set-item" onclick="startAssessment(getTestSets()[${i}])"><div class="name">${esc(s.name)}</div><div class="count">${s.questions.length} 题</div></li>`).join('')}</ul><div class="modal-actions"><button class="btn-secondary" onclick="closeAssessment()">取消</button></div>`;
            modal.style.display = 'flex';
        }
        function startAssessment(set) {
            currentTestSet = set; userAnswers = {};
            const modal = document.getElementById('assessmentModal'), content = document.getElementById('modalContent');
            content.innerHTML = `<h2>🧠 ${esc(set.name)}</h2><p style="color:#888;">请选择最符合的选项</p><div id="questionsContainer"></div><div class="modal-actions"><button class="btn-secondary" onclick="closeAssessment()">取消</button><button class="btn-primary" onclick="submitCurrentAssessment()">提交</button></div>`;
            const qContainer = document.getElementById('questionsContainer');
            set.questions.forEach((q, idx) => {
                const block = document.createElement('div'); block.className = 'question-block';
                block.innerHTML = `<div class="question-text">${idx+1}. ${esc(q.text)}</div><div class="options" id="options-${q.id||idx}"></div>`;
                qContainer.appendChild(block);
                const optsDiv = document.getElementById(`options-${q.id||idx}`);
                (q.options||[]).forEach(opt => {
                    const label = document.createElement('label'); label.className = 'option-label';
                    label.innerHTML = `<input type="radio" name="q${q.id||idx}" value="${opt.value}"> ${esc(opt.label)}`;
                    label.addEventListener('click', () => {
                        userAnswers[q.id||idx] = opt.value;
                        optsDiv.querySelectorAll('.option-label').forEach(el=>el.classList.remove('selected'));
                        label.classList.add('selected');
                    });
                    optsDiv.appendChild(label);
                });
            });
            modal.style.display = 'flex';
        }
        function submitCurrentAssessment() {
            if (!currentTestSet) return;
            const questions = currentTestSet.questions;
            if (Object.keys(userAnswers).length < questions.length) { alert('请完成所有题目'); return; }
            let totalScore = 0;
            questions.forEach(q => { totalScore += parseFloat(userAnswers[q.id||questions.indexOf(q)])||0; });
            const maxScore = questions.reduce((sum, q) => sum + Math.max(...(q.options||[]).map(o=>parseFloat(o.value)||0)), 0);
            const ratio = maxScore>0 ? totalScore/maxScore : 0;
            let grade, suggestion;
            if (ratio<0.25) { grade='良好'; suggestion='状态稳定。'; }
            else if (ratio<0.5) { grade='轻度'; suggestion='建议关注情绪。'; }
            else if (ratio<0.75) { grade='中度'; suggestion='建议寻求专业帮助。'; }
            else { grade='重度'; suggestion='请立即联系心理医生。'; }
            const record = { timestamp: new Date().toISOString(), testSetName: currentTestSet.name, answers:{...userAnswers}, totalScore, maxScore, grade, suggestion };
            saveAssessmentRecord(record);
            const content = document.getElementById('modalContent');
            content.innerHTML = `<h2>📊 测评结果</h2><div class="result-box"><div>${esc(currentTestSet.name)}</div><div class="score">${totalScore} 分 (满分 ${maxScore})</div><div class="grade">等级：${grade}</div><p>${suggestion}</p></div><div class="modal-actions"><button class="btn-primary" onclick="closeAssessment()">关闭</button></div>`;
        }
        function closeAssessment() { document.getElementById('assessmentModal').style.display = 'none'; currentTestSet = null; userAnswers = {}; }
        function saveAssessmentRecord(record) { const raw = localStorage.getItem(ASSESS_STORAGE_KEY); const records = raw ? JSON.parse(raw) : []; records.push(record); localStorage.setItem(ASSESS_STORAGE_KEY, JSON.stringify(records)); }
        function esc(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        document.getElementById('assessmentBtn').addEventListener('click', openAssessment);
        document.getElementById('assessmentModal').addEventListener('click', function(e){ if(e.target===this) closeAssessment(); });

        // ==================== 占位按钮 ====================
        document.getElementById('activityBtn').addEventListener('click', ()=>alert('🎯 活动功能开发中'));
        document.getElementById('writingBtn').addEventListener('click', ()=>alert('✍️ 书写练习功能开发中'));
        document.getElementById('improveBtn').addEventListener('click', ()=>alert('🚀 我要提升功能开发中'));

        // ==================== 初始化 ====================
        refreshSuggested(); scrollToBottom(); userInput.focus();
        setInterval(() => { const cur = loadQAData(); if (JSON.stringify(cur) !== JSON.stringify(qaData)) { qaData = cur; refreshSuggested(); } }, 3000);
    </script>
</body>
</html>
