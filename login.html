<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 心灵倾听者</title>
    <style>
        :root {
            --primary: #7c6fa0;
            --bg: #f7f5f2;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #f5f0f0 0%, #f0eef6 30%, #f6f3f0 60%, #f2eff5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 360px;
            max-width: 90%;
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1.5px solid #e5e0eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-secondary {
            background: #f0ecf5;
            color: var(--primary);
        }
        .error {
            color: #c97a7a;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        .change-pwd-link {
            text-align: center;
            margin-top: 12px;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
        }
        .change-pwd-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🧠 心灵倾听者</h2>
        <div id="errorMsg" class="error" style="display:none;"></div>
        <input type="text" id="username" placeholder="账号" autocomplete="username">
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
        <button class="btn" id="loginBtn">登 录</button>
        <div class="change-pwd-link" id="changePwdLink">修改密码</div>
    </div>

    <script>
        const API = '/api/login';
        const CHANGE_PWD_API = '/api/change-password';

        const loginBtn = document.getElementById('loginBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const changePwdLink = document.getElementById('changePwdLink');

        // 检查是否已登录
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) return false;
            try {
                const res = await fetch(`/api/verify?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                if (data.valid) {
                    window.location.href = '/index.html';
                    return true;
                }
            } catch(e) {}
            return false;
        }
        checkAuth();

        loginBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            if (!username || !password) {
                showError('请输入账号和密码');
                return;
            }
            try {
                const res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username);
                    window.location.href = '/index.html';
                } else {
                    showError(data.message || '账号或密码错误');
                }
            } catch(e) {
                showError('网络错误，请稍后再试');
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        // 修改密码链接
        changePwdLink.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            if (!username) {
                alert('请先输入账号');
                return;
            }
            const oldPwd = prompt('请输入当前密码：');
            if (!oldPwd) return;
            const newPwd = prompt('请输入新密码（英文+数字，至少6位）：');
            if (!newPwd || newPwd.length < 6) {
                alert('密码至少6位，且为英文和数字组合');
                return;
            }
            if (!/^[a-zA-Z0-9]+$/.test(newPwd)) {
                alert('密码只能包含英文字母和数字');
                return;
            }
            fetch(CHANGE_PWD_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, oldPassword: oldPwd, newPassword: newPwd })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('密码修改成功，请重新登录');
                    localStorage.clear();
                    window.location.reload();
                } else {
                    alert(data.message || '修改失败');
                }
            })
            .catch(() => alert('网络错误'));
        });
    </script>
</body>
</html>
